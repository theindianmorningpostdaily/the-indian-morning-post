name: Publish Manual Article

# Publishes a hand-written article committed under pipeline/manual/.
# Run from the Actions tab: pick the JSON file, optionally dry-run first.
# The Supabase service key never leaves GitHub — that is the whole point of
# doing this here rather than from a laptop.
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Article JSON under pipeline/manual/ (e.g. chimnaramji-jodhaji-gehlot.json)"
        required: true
        type: string
      dry_run:
        description: "Validate only — do not write to the database"
        required: false
        type: boolean
        default: true

concurrency:
  group: manual-article
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish article
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          python manual_publish.py "manual/${{ inputs.file }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}